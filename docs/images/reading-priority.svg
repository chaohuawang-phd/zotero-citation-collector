<svg xmlns="http://www.w3.org/2000/svg" width="760" height="792" viewBox="0 0 760 792" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">收藏引文时标星、写阅读说明</title>
  <desc id="desc">操作示意图，论文题名均为示例。对正文引用选择「标注并收藏…」，为《马尔可夫链的状态转移》填写“这是一篇关于马尔可夫的论文。”并选择四星。保存后，个人文库的「重要性」和「阅读说明」列显示这两项，按重要性排序时五星、四星位于前面，未评分的单元格为空。</desc>
  <defs>
    <style>
      text {font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#192b38}
      .meta {fill:#475e6e;font-size:17px}
      .txt {font-size:20px}
      .cell {font-size:19px}
      .head {font-weight:600;font-size:19px}
      .star {font-family:"Arial Unicode MS","DejaVu Sans","PingFang SC",sans-serif;font-size:20px}
      .soft {fill:#475e6e}
      .accent {fill:#215b5b}
      .border {stroke:#c0cfd5;stroke-width:1.3}
      .rule {stroke:#d8e1e5;stroke-width:1}
    </style>
  </defs>
  <rect width="760" height="792" rx="14" fill="#f4f7f8"/>
  <text x="28" y="36" class="meta" font-weight="600">Zotero · 操作示意图</text>
  <text x="27" y="82" font-size="35" font-weight="650">收藏时标星、写阅读说明</text>

  <g id="command">
    <text x="29" y="128" class="txt soft">正文引文右键菜单</text>
    <path d="M208 121h28m-7-6 7 6-7 6" fill="none" stroke="#718895" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="255" y="100" width="172" height="40" rx="6" fill="#e0eee8" stroke="#a8c7b7"/>
    <text x="341" y="127" text-anchor="middle" font-size="21" font-weight="600" class="accent">标注并收藏…</text>
  </g>

  <g id="input-dialog">
    <rect x="28" y="156" width="704" height="303" rx="10" fill="white" class="border"/>
    <text x="50" y="194" font-size="24" font-weight="650">标注并收藏</text>
    <text x="50" y="226" class="txt soft">马尔可夫链的状态转移</text>
    <path d="M50 243h660" class="rule"/>
    <text x="50" y="276" class="head">阅读说明</text>
    <rect x="153" y="252" width="557" height="64" rx="5" fill="#fff" stroke="#a3b5be"/>
    <text x="168" y="283" class="txt">这是一篇关于马尔可夫的论文。</text>
    <text x="50" y="357" class="head">重要性</text>
    <g id="rating-choices" fill="#f8fafb" stroke="#c6d2d8">
      <rect x="153" y="330" width="79" height="40" rx="5"/>
      <rect x="240" y="330" width="41" height="40" rx="5"/>
      <rect x="289" y="330" width="58" height="40" rx="5"/>
      <rect x="355" y="330" width="76" height="40" rx="5"/>
      <rect x="439" y="330" width="99" height="40" rx="5" fill="#215b5b" stroke="#215b5b"/>
      <rect x="546" y="330" width="114" height="40" rx="5"/>
    </g>
    <g text-anchor="middle">
      <text x="192.5" y="357" font-size="17" class="soft">未评分</text>
      <text x="260.5" y="357" class="star soft">★</text>
      <text x="318" y="357" class="star soft">★★</text>
      <text x="393" y="357" class="star soft">★★★</text>
      <text x="488.5" y="357" class="star" style="fill:#fff">★★★★</text>
      <text x="603" y="357" class="star soft">★★★★★</text>
    </g>
    <path d="M50 389h660" class="rule"/>
    <rect x="485" y="401" width="70" height="39" rx="5" fill="#f5f7f8" stroke="#c6d2d8"/>
    <text x="520" y="428" text-anchor="middle" font-size="18">取消</text>
    <rect x="565" y="401" width="145" height="39" rx="5" fill="#215b5b"/>
    <text x="637.5" y="428" text-anchor="middle" font-size="19" font-weight="600" style="fill:#fff">保存并收藏</text>
  </g>

  <g id="collection">
    <text x="29" y="505" font-size="24" font-weight="650">我的文库 / 待读论文</text>
    <text x="729" y="503" text-anchor="end" class="meta">按重要性从高到低排列</text>
    <rect x="28" y="521" width="704" height="202" rx="7" fill="white" class="border"/>
    <path d="M35 521h690q7 0 7 7v39H28v-39q0-7 7-7Z" fill="#e7eef1"/>
    <rect x="29" y="618" width="702" height="51" fill="#e4f1ea"/>
    <path d="M241 522v200m143-200v200M28 567h704M28 618h704M28 669h704" class="rule"/>
    <g class="head">
      <text x="43" y="552">标题</text>
      <text x="257" y="552">重要性</text>
      <path d="M331 538v15m-5-5 5 5 5-5" fill="none" stroke="#657b88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="400" y="552">阅读说明</text>
    </g>
    <g class="cell">
      <text x="43" y="600">带噪观测下的状态估计</text>
      <text x="257" y="600" class="star accent">★★★★★</text>
      <text x="400" y="600">先看状态估计的推导。</text>
      <text x="43" y="651">马尔可夫链的状态转移</text>
      <text x="257" y="651" class="star accent">★★★★</text>
      <text x="400" y="651">这是一篇关于马尔可夫的论文。</text>
      <text x="43" y="702">离散过程的模拟</text>
    </g>
  </g>
  <text x="29" y="760" class="meta">题名均为示例。尚未评分的论文，其「重要性」单元格留空。</text>
</svg>
